<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setia Alam — Iris Massage</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --card-hover: #242424;
            --accent-color: #25D366;
            --accent-hover: #20ba5a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #2c2c2c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding: 16px; display: flex; justify-content: center; }
        .main-container { width: 100%; max-width: 480px; }
        
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .subtitle { color: var(--text-secondary); font-size: 13px; margin-bottom: 16px; }
        
        .stats-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 16px; font-size: 14px; }
        .count { font-weight: bold; color: var(--accent-color); }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
        .tab { background: var(--card-bg); color: var(--text-secondary); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .tab.active { background: var(--text-primary); color: var(--bg-color); font-weight: 600; border-color: var(--text-primary); }
        
        .search-box { position: relative; margin-bottom: 20px; }
        .search-box input { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px 16px 12px 40px; border-radius: 12px; font-size: 14px; outline: none; }
        .search-box span { position: absolute; left: 14px; top: 13px; color: var(--text-secondary); }
        
        .profile-list { display: flex; flex-direction: column; gap: 12px; }
        .profile-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .profile-card:hover { background: var(--card-hover); }
        
        .profile-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .badge-popular { background: #ff4757; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .profile-details { font-size: 13px; color: var(--text-secondary); }
        
        .book-btn { background-color: var(--accent-color); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: background 0.2s; }
        .book-btn:hover { background-color: var(--accent-hover); }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>Setia Alam — Iris Massage</h1>
            <div class="subtitle">Business Hours: 12PM - 11PM • Setia Alam</div>
        </header>

        <div class="stats-bar">
            <span>23 available</span>
            <span class="count">All 23</span>
        </div>

        <div class="tabs">
            <div class="tab active">Available</div>
            <div class="tab">Popular RM80</div>
        </div>

        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search ID or name" onkeyup="filterProfiles()">
        </div>

        <div class="profile-list" id="profileList">
            <!-- Dynamic Profiles -->
        </div>
    </div>

    <script>
        const profiles = [
            { id: "023", name: "jessy", price: 75, popular: false },
            { id: "017", name: "Novi", price: 75, popular: false },
            { id: "661", name: "Mimi", price: 75, popular: false },
            { id: "021", name: "acha", price: 75, popular: false },
            { id: "012", name: "Elly", price: 80, popular: true },
            { id: "V1", name: "Sofie", price: 75, popular: false },
            { id: "016", name: "Caca", price: 75, popular: false },
            { id: "T22", name: "Wawa", price: 75, popular: false },
            { id: "020", name: "Arie", price: 75, popular: false },
            { id: "675", name: "KK", price: 75, popular: false },
            { id: "V32", name: "melody", price: 75, popular: false },
            { id: "011", name: "Sheron", price: 80, popular: true },
            { id: "028", name: "Sandra", price: 75, popular: false },
            { id: "928", name: "Lisa", price: 75, popular: false },
            { id: "018", name: "Fera", price: 75, popular: false },
            { id: "601", name: "Lela", price: 75, popular: false },
            { id: "V18", name: "Yumi", price: 80, popular: true },
            { id: "015", name: "Niya", price: 75, popular: false },
            { id: "C6", name: "Ke", price: 80, popular: true },
            { id: "T33", name: "Bella", price: 75, popular: false },
            { id: "T35", name: "Irin", price: 75, popular: false },
            { id: "037", name: "nova", price: 75, popular: false },
            { id: "036", name: "erni", price: 75, popular: false }
        ];

        function renderProfiles(filter = "") {
            const listEl = document.getElementById("profileList");
            listEl.innerHTML = "";
            
            const filtered = profiles.filter(p => 
                p.id.toLowerCase().includes(filter.toLowerCase()) || 
                p.name.toLowerCase().includes(filter.toLowerCase())
            );

            filtered.forEach(p => {
                const card = document.createElement("div");
                card.className = "profile-card";
                card.innerHTML = `
                    <div class="profile-info">
                        <h3>${p.id} ${p.name} ${p.popular ? '<span class="badge-popular">POPULAR</span>' : ''}</h3>
                        <div class="profile-details">MYR ${p.price}.00 • 60 min • Setia Alam</div>
                    </div>
                    <a href="https://wa.me/601139465648?text=Hello%2C%20I%20would%20like%20to%20book%20${p.id}%20${p.name}" target="_blank" class="book-btn">+ Book</a>
                `;
                listEl.appendChild(card);
            });
        }

        function filterProfiles() {
            const query = document.getElementById("searchInput").value;
            renderProfiles(query);
        }

        renderProfiles();
    </script>
</body>
</html>
