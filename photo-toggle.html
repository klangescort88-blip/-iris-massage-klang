<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Setia Alam - Iris Massage</title>
<style>
:root{--bg:#0d0d0d;--card:#1a1a1a;--gold:#d9bc82;--green:#2de08a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#eee;font-family:Inter,system-ui,sans-serif;padding:12px;padding-bottom:90px}

.header{background:var(--card);border:1px solid #222;border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.header h1{font-size:18px;line-height:1.1}
.header h1 i{color:var(--gold);font-style:italic}
.sub{font-size:10px;color:var(--gold);margin-top:4px}
.badge{background:#1e1e1e;border:1px solid #222;padding:8px 12px;border-radius:999px;font-size:11px;color:#aaa;white-space:nowrap;flex-shrink:0}

.filters{display:flex;gap:8px;margin:12px 0;overflow:auto}
.f{padding:10px 18px;border-radius:999px;border:1px solid #2a2a2a;background:#1e1e1e;color:#aaa;font-size:13px;white-space:nowrap;cursor:pointer}
.f.active{background:#fff;color:#000;font-weight:800}

.search{width:100%;background:#1a1a1a;border:1px solid #222;border-radius:12px;padding:12px 14px;color:#eee;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.search input{background:transparent;border:none;color:#eee;width:100%;outline:none;font-size:13px}

.card{background:var(--card);border:1px solid #222;border-radius:18px;padding:12px;display:flex;gap:12px;margin-bottom:10px;position:relative}
.card::before{content:'';position:absolute;left:12px;top:14px;width:10px;height:10px;background:var(--green);border-radius:50%;border:2px solid var(--card)}
.thumb{width:80px;height:80px;border-radius:14px;overflow:hidden;background:#111;flex-shrink:0;margin-left:10px;border:1px solid #2a2a2a}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#222,#111);color:#555;font-size:28px;font-weight:800}
.info{flex:1;min-width:0}
.name{font-weight:700;font-size:14px}
.name span{color:#777;font-size:13px;margin-right:4px}
.pop{background:var(--gold);color:#000;font-size:9px;font-weight:900;padding:3px 7px;border-radius:99px;margin-left:6px}
.price{color:var(--gold);font-weight:800;font-size:13px;margin-top:2px}
.price small{color:#666;font-size:11px;font-weight:400}
.book{margin-top:10px;width:100%;background:#fff;color:#000;border:none;border-radius:999px;padding:10px;font-weight:800;display:flex;justify-content:center;gap:6px;cursor:pointer;font-size:13px;font-family:inherit}
.book b{background:#000;color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.empty{text-align:center;color:#555;padding:30px;font-size:13px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;z-index:50}
.overlay.open{display:flex}
.sheet{width:100%;background:#181818;border-radius:22px 22px 0 0;padding:18px;max-height:85vh;overflow:auto;border:1px solid #2a2a2a;position:relative}
.sheet h2{font-family:Georgia,serif;font-size:22px;padding-right:40px}
.sheet .meta{color:#888;font-size:12px;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.slot{background:#222;border:1px solid #333;border-radius:999px;padding:12px;text-align:center;font-size:13px;color:#fff;cursor:pointer;font-family:inherit}
.slot:hover{background:#2c2c2c}
.close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:#222;border:1px solid #333;color:#fff;cursor:pointer;font-size:14px}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Setia Alam — <i>Iris Massage</i></h1>
    <div class="sub" id="hoursTxt">Business Hours: 12PM - 11PM • Setia Alam</div>
  </div>
  <div class="badge" id="cnt">—</div>
</div>

<div class="filters">
  <button class="f active" data-f="all">All</button>
  <button class="f" data-f="avail">Available</button>
  <button class="f" data-f="pop">Popular RM80</button>
</div>

<div class="search">🔍 <input id="q" placeholder="Search ID or name"></div>

<div id="list"></div>

<div class="overlay" id="ov">
  <div class="sheet">
    <button class="close" onclick="closeM()">✕</button>
    <h2 id="mt"></h2>
    <div class="meta" id="ms"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
const DEF = [
  ["023","jessy",75,0],["017","Novi",75,0],["661","Mimi",75,0],["021","acha",75,0],
  ["012","Elly",80,1],["V1","Sofie",75,0],["016","Caca",75,0],["T22","Wawa",75,0],
  ["020","Arie",75,0],["675","KK",75,0],["V32","melody",75,0],["011","Sheron",80,1],
  ["028","Sandra",75,0],["928","Lisa",75,0],["018","Fera",75,0],["601","Lela",75,0],
  ["V18","Yumi",80,1],["015","Niya",75,0],["C6","Ke",80,1],["T33","Bella",75,0],
  ["T35","Irin",75,0],["037","nova",75,0],["036","erni",75,0]
];

function loadData(){
  try{
    const raw = localStorage.getItem('iris_v2_data');
    if(raw){
      const d = JSON.parse(raw);
      if(Array.isArray(d)) return d;
    }
  }catch(e){ console.warn('Corrupt iris_v2_data, resetting.', e); }
  return DEF.map(([id,name,price,pop]) => ({ id, name, price, popular: !!pop, available: true, photo: null }));
}
function loadSettings(){
  try{
    const raw = localStorage.getItem('iris_v2_settings');
    if(raw) return JSON.parse(raw) || {};
  }catch(e){ console.warn('Corrupt settings.', e); }
  return {};
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cleanWa(v){ return String(v || '').replace(/\D/g,'') || '601139465648'; }
function fmt(n){ return Number(n || 0).toFixed(2); }

function parseHours(str){
  const s = String(str || '').toUpperCase().replace(/\s+/g,' ').trim();
  const m = s.match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?\s*[-–—]\s*(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/);
  if(!m) return { start: 12, end: 23 };
  const to24 = (h, ap) => {
    h = +h;
    if(ap === 'PM' && h < 12) h += 12;
    if(ap === 'AM' && h === 12) h = 0;
    return h;
  };
  const startAp = m[3] || m[6];
  const endAp   = m[6] || m[3];
  let st = to24(m[1], startAp);
  let en = to24(m[4], endAp);
  if(en === 0) en = 24;                       // 12AM = midnight
  if(en <= st) en = Math.min(24, st + 1);
  return { start: Math.max(0, Math.min(23, st)), end: Math.min(24, en) };
}
function slots(){
  const { start, end } = parseHours(hours);
  const res = [];
  for(let hr = start; hr <= end; hr++){
    for(const mn of [0, 30]){
      if(hr === end && mn !== 0) continue;
      const ap = (hr === 24 || hr < 12) ? 'AM' : 'PM';
      const hh = hr % 12 === 0 ? 12 : hr % 12;
      res.push(`${hh}:${mn ? '30' : '00'} ${ap}`);
    }
  }
  return res;
}

let data     = loadData();
let settings = loadSettings();
let hours    = settings.hours || localStorage.getItem('iris_hours') || '12PM - 11PM';
let wa       = cleanWa(settings.wa || localStorage.getItem('iris_wa') || '601139465648');

let filter = 'all', search = '';

const $ = id => document.getElementById(id);
$('hoursTxt').textContent = `Business Hours: ${hours} • Setia Alam`;

function render(){
  let disp = data.filter(t => t.available);
  if(filter === 'pop') disp = disp.filter(t => t.popular);
  if(search){
    const q = search.toLowerCase();
    disp = disp.filter(t => t.id.toLowerCase().includes(q) || t.name.toLowerCase().includes(q));
  }

  const list = $('list');
  list.innerHTML = '';
  if(!disp.length){
    list.innerHTML = '<div class="empty">No staff available right now. Please check again later.</div>';
  } else {
    disp.forEach(t => {
      const idx = data.indexOf(t);
      const div = document.createElement('div');
      div.className = 'card';
      const photoHtml = t.photo
        ? `<img src="${t.photo}" alt="">`
        : `<div class="ph">${esc((t.name[0] || '?').toUpperCase())}</div>`;
      div.innerHTML = `
        <div class="thumb">${photoHtml}</div>
        <div class="info">
          <div class="name"><span>${esc(t.id)}</span> ${esc(t.name)} ${t.popular ? '<span class="pop">POPULAR</span>' : ''}</div>
          <div class="price">MYR ${fmt(t.price)} <small>• 60 min • Setia Alam</small></div>
          <button class="book" onclick="openM(${idx})"><b>+</b> Book</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  const avail = data.filter(d => d.available).length;
  $('cnt').textContent = `${avail} available`;
  const allBtn = document.querySelector('.f[data-f="all"]');
  if(allBtn) allBtn.textContent = `All ${data.length}`;
}

window.openM = idx => {
  const t = data[idx];
  if(!t) return;
  $('mt').textContent = `Choose time — ${t.name}`;
  $('ms').textContent = `ID ${t.id} • MYR ${fmt(t.price)} • 60 min • ${hours}`;
  const g = $('grid');
  g.innerHTML = '';
  const list = slots();
  if(!list.length){
    g.innerHTML = '<div class="empty" style="grid-column:1/-1">No slots available.</div>';
  } else {
    list.forEach(time => {
      const b = document.createElement('button');
      b.className = 'slot';
      b.textContent = time;
      b.onclick = () => {
        const msg = encodeURIComponent(
          `Hi Iris Massage Setia Alam, I want to book ${t.id} ${t.name} at ${time} today. Price MYR ${fmt(t.price)} 60min.`
        );
        window.open(`https://wa.me/${wa}?text=${msg}`, '_blank');
        closeM();
      };
      g.appendChild(b);
    });
  }
  $('ov').classList.add('open');
};
window.closeM = () => $('ov').classList.remove('open');
$('ov').addEventListener('click', e => { if(e.target === $('ov')) closeM(); });

document.querySelectorAll('.f').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.f').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    filter = b.dataset.f;
    render();
  });
});
$('q').addEventListener('input', e => { search = e.target.value; render(); });

/* live sync from admin tab */
window.addEventListener('storage', e => {
  if(e.key === 'iris_v2_data'){
    data = loadData();
    render();
  }
  if(e.key === 'iris_v2_settings' || e.key === 'iris_hours' || e.key === 'iris_wa'){
    settings = loadSettings();
    hours = settings.hours || localStorage.getItem('iris_hours') || hours;
    wa    = cleanWa(settings.wa || localStorage.getItem('iris_wa') || wa);
    $('hoursTxt').textContent = `Business Hours: ${hours} • Setia Alam`;
    render();
  }
});

render();
</script>
</body>
</html>
